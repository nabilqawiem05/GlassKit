name: Build GlassKit APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project (if uploaded as GlassKit.zip)
        run: |
          if [ ! -f settings.gradle ] && [ -f GlassKit.zip ]; then
            unzip -o GlassKit.zip -d .
          fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GlassKit-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to the "latest" release (direct download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk GlassKit.apk
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle || echo dev)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GlassKit.apk --title "GlassKit $VER" --notes "Muat turun GlassKit.apk dan pasang. Versi $VER." --latest
