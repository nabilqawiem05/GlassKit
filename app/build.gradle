plugins {
    id 'com.android.application'
}

android {
    namespace 'com.glasskit.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.glasskit.app'
        minSdk 31
        targetSdk 35
        versionCode 44
        versionName '14.3'
        // Pixel 8 Pro = arm64; elak saiz APK berganda untuk ABI lain (TFLite)
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        fixed {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Model kedalaman MiDaS v2.1 small (MIT, Intel ISL) dimuat turun semasa binaan
def midasModel = file('src/main/assets/midas.tflite')
tasks.register('fetchMidas') {
    outputs.file(midasModel)
    doLast {
        if (!midasModel.exists() || midasModel.length() < 1000000) {
            midasModel.parentFile.mkdirs()
            try {
                new URL('https://github.com/isl-org/MiDaS/releases/download/v2_1/model_opt.tflite').withInputStream { i ->
                    midasModel.withOutputStream { it << i }
                }
                println "MiDaS model: ${midasModel.length()} bytes"
            } catch (Exception e) {
                println "MiDaS download failed (3D falls back to 2 layers): ${e}"
                midasModel.delete()
            }
        }
    }
}
preBuild.dependsOn fetchMidas

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'

    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
